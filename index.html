<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Automation 실전 노하우 아카이브</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { --bg-color: #0f1115; --card-bg: #1a1d24; --text-main: #e2e8f0; --text-sub: #94a3b8; --accent: #6366f1; --border-color: #2d3748; --featured-color: #f59e0b; }
        body { font-family: 'Pretendard', sans-serif; line-height: 1.5; color: var(--text-main); background-color: var(--bg-color); margin: 0; padding: 40px 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; padding-bottom: 30px; border-bottom: 1px solid var(--border-color); }
        .badge { background: rgba(99, 102, 241, 0.1); color: #818cf8; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; display: inline-block; margin-bottom: 15px; border: 1px solid rgba(99, 102, 241, 0.2); }
        h1 { font-size: 34px; font-weight: 800; margin: 0 0 15px 0; color: #fff; }
        .subtitle { color: var(--text-sub); font-size: 16px; margin: 0; }
        
        /* 카테고리 필터 스타일 */
        .filter-container { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
        .filter-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-sub); padding: 8px 18px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; outline: none; }
        .filter-btn:hover { border-color: var(--accent); color: var(--text-main); }
        .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .archive-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .archive-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; }
        .archive-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 4px 20px rgba(99, 102, 241, 0.15); }
        
        /* 🌟 Featured(상단 고정) 카드 전용 스타일 */
        .archive-card.featured-card { border-color: rgba(245, 158, 11, 0.5); background: linear-gradient(to bottom right, var(--card-bg), rgba(245, 158, 11, 0.03)); }
        .archive-card.featured-card:hover { border-color: var(--featured-color); box-shadow: 0 4px 20px rgba(245, 158, 11, 0.15); }
        .featured-icon { color: var(--featured-color); margin-right: 5px; }

        .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .card-num { background: rgba(255, 255, 255, 0.05); color: #cbd5e1; font-weight: 700; font-size: 12px; padding: 4px 8px; border-radius: 6px; }
        .card-num.featured-num { background: rgba(245, 158, 11, 0.1); color: var(--featured-color); }
        .card-category { background: rgba(99, 102, 241, 0.1); color: #818cf8; font-weight: 700; font-size: 12px; padding: 4px 8px; border-radius: 6px; margin-left: 6px; }
        
        .card-icon { color: var(--accent); font-size: 20px; }
        .archive-card h3 { margin: 0 0 10px 0; font-size: 17px; color: #fff; font-weight: 700; line-height: 1.4; }
        .archive-card p { margin: 0 0 15px 0; font-size: 13px; color: var(--text-sub); line-height: 1.5; }
        .card-date { font-size: 12px; color: var(--text-sub); margin-bottom: 15px; }
        .card-footer { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--accent); border-top: 1px solid var(--border-color); padding-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="badge"><i class="fa-solid fa-wand-magic-sparkles"></i> PORTFOLIO & ARCHIVE</div>
        <h1>AI & AUTOMATION PROFIT ARCHIVE</h1>
        <p class="subtitle">인공지능과 자동화 기술을 활용한 실전 노하우 집약소</p>
    </header>

    <!-- 카테고리 버튼이 들어갈 자리 -->
    <div id="filter-container" class="filter-container"></div>

    <!-- 카드가 렌더링될 자리 -->
    <div id="archive-grid" class="archive-grid"></div>
</div>

<!-- 💡 외부 데이터베이스 파일 연결 -->
<script src="data.js"></script>

<!-- 💡 카테고리 필터링 및 관리자 제어(Featured/Hidden) 엔진 -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const grid = document.getElementById('archive-grid');
        const filterContainer = document.getElementById('filter-container');
        
        // 데이터가 없거나 로드되지 않았을 경우 에러 방지
        if (typeof archiveData === 'undefined') {
            grid.innerHTML = '<p style="color: #ef4444; text-align: center; width: 100%;">데이터를 불러오지 못했습니다. data.js 파일을 확인해주세요.</p>';
            return;
        }

        // 1. hidden: true 인 항목은 화면에서 완전히 제외시킴 (숨김 기능)
        const visibleData = archiveData.filter(item => item.hidden !== true);

        // 카테고리 종류 추출
        const categories = ['전체보기', ...new Set(visibleData.map(item => item.category))];
        let currentCategory = '전체보기';

        // 2. 상단 카테고리 버튼 렌더링
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `filter-btn ${cat === '전체보기' ? 'active' : ''}`;
            btn.textContent = cat;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = cat;
                renderCards();
            });
            filterContainer.appendChild(btn);
        });

        // 3. 카드 목록 렌더링 함수
        function renderCards() {
            grid.innerHTML = '';
            
            // 카테고리 필터링 적용
            let currentData = currentCategory === '전체보기' ? visibleData : visibleData.filter(item => item.category === currentCategory);
            
            // 🌟 Featured(상단 고정) 카드 최상단 정렬
            currentData.sort((a, b) => {
                const aFeatured = a.featured ? 1 : 0;
                const bFeatured = b.featured ? 1 : 0;
                if (bFeatured !== aFeatured) {
                    return bFeatured - aFeatured; // Featured 우선
                }
                return b.id - a.id; // 나머지는 최신순(ID 역순) 정렬
            });
            
            currentData.forEach(item => {
                const isFeatured = item.featured === true;
                const card = document.createElement('a');
                card.href = item.url;
                
                // Featured 전용 스타일링 클래스 적용
                card.className = `archive-card ${isFeatured ? 'featured-card' : ''}`;
                
                card.innerHTML = `
                    <div>
                        <div class="card-top">
                            <div>
                                <span class="card-num ${isFeatured ? 'featured-num' : ''}">
                                    ${isFeatured ? '<i class="fa-solid fa-star featured-icon"></i>' : ''}GUIDE ${String(item.id).padStart(2, '0')}
                                </span>
                                <span class="card-category">${item.category}</span>
                            </div>
                            <i class="${item.icon} card-icon" style="${isFeatured ? 'color: var(--featured-color);' : ''}"></i>
                        </div>
                        <h3>${item.title}</h3>
                        <div class="card-date"><i class="fa-regular fa-calendar"></i> ${item.date}</div>
                        <p>${item.desc}</p>
                    </div>
                    <div class="card-footer">
                        <span style="${isFeatured ? 'color: var(--featured-color);' : ''}">가이드 읽어보기</span>
                        <i class="fa-solid fa-arrow-right" style="${isFeatured ? 'color: var(--featured-color);' : ''}"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        
        // 첫 화면 로딩 시 렌더링 실행
        renderCards();
    });
</script>
</body>
</html>
