<!-- 💡 카테고리 필터링 및 관리자 제어(Featured/Hidden) 엔진 -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const grid = document.getElementById('archive-grid');
        const filterContainer = document.getElementById('filter-container');
        
        // 1. hidden: true 인 항목은 아예 데이터에서 제외시킴 (숨김 기능)
        const visibleData = archiveData.filter(item => item.hidden !== true);

        const categories = ['전체보기', ...new Set(visibleData.map(item => item.category))];
        let currentCategory = '전체보기';

        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `filter-btn ${cat === '전체보기' ? 'active' : ''}`;
            btn.textContent = cat;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = cat;
                renderCards();
            });
            filterContainer.appendChild(btn);
        });

        function renderCards() {
            grid.innerHTML = '';
            
            // 2. 카테고리 필터링 적용
            let currentData = currentCategory === '전체보기' ? visibleData : visibleData.filter(item => item.category === currentCategory);
            
            // 3. Featured 카드 최상단 정렬 (featured: true가 무조건 먼저 오도록)
            currentData.sort((a, b) => {
                const aFeatured = a.featured ? 1 : 0;
                const bFeatured = b.featured ? 1 : 0;
                if (bFeatured !== aFeatured) {
                    return bFeatured - aFeatured; // Featured 우선
                }
                return b.id - a.id; // 나머지는 최신순(ID 역순)
            });
            
            currentData.forEach(item => {
                const card = document.createElement('a');
                card.href = item.url;
                
                // Featured 카드일 경우 특별한 CSS 클래스와 황금색 별표 추가
                const isFeatured = item.featured;
                card.className = `archive-card ${isFeatured ? 'featured-card' : ''}`;
                const featureBadge = isFeatured ? '<i class="fa-solid fa-star" style="color: #f59e0b; margin-right: 5px;"></i>' : '';
                
                // Featured면 테두리를 황금색으로
                if (isFeatured) card.style.borderColor = "rgba(245, 158, 11, 0.4)";

                card.innerHTML = `
                    <div>
                        <div class="card-top">
                            <div>
                                <span class="card-num">${featureBadge}GUIDE ${String(item.id).padStart(2, '0')}</span>
                                <span class="card-category">${item.category}</span>
                            </div>
                            <i class="${item.icon} card-icon" style="${isFeatured ? 'color: #f59e0b;' : ''}"></i>
                        </div>
                        <h3>${item.title}</h3>
                        <div class="card-date"><i class="fa-regular fa-calendar"></i> ${item.date}</div>
                        <p>${item.desc}</p>
                    </div>
                    <div class="card-footer">
                        <span style="${isFeatured ? 'color: #f59e0b;' : ''}">가이드 읽어보기</span>
                        <i class="fa-solid fa-arrow-right" style="${isFeatured ? 'color: #f59e0b;' : ''}"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        
        renderCards();
    });
</script>
